# Kuber — hyprlock. Black field, corner data-brackets, red brand tick.
#
# hyprlock `shape` borders render as a filled rect, not a hollow outline, and
# per-edge halign/valign offsets are inconsistent (hyprwm/hyprlock#458, #516,
# #744) — same caveats Skemos hit. Every bracket arm is a small SOLID rect,
# anchored halign=center / valign=center with a hardcoded offset from the
# 2560x1440 centre (+x right, +y up). Update the offsets if the panel size
# changes or this is ported to a different resolution.

general {
    hide_cursor        = true
    ignore_empty_input = true
    text_trim          = true
}

background {
    monitor     =
    color       = rgb(0a0a0d)
    blur_passes = 0
    blur_size   = 0
}

# ---- corner data-brackets --------------------------------------------------
# Two solid arms per corner (horizontal 52x2, vertical 2x52); corner point
# sits 56px in from each screen edge.

# top-left
shape { monitor = ; size = 52, 2; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = -1204, 664; }
shape { monitor = ; size = 2, 52; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = -1228, 638; }

# top-right
shape { monitor = ; size = 52, 2; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = 1204, 664; }
shape { monitor = ; size = 2, 52; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = 1228, 638; }

# bottom-left
shape { monitor = ; size = 52, 2; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = -1204, -664; }
shape { monitor = ; size = 2, 52; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = -1228, -638; }

# bottom-right
shape { monitor = ; size = 52, 2; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = 1204, -664; }
shape { monitor = ; size = 2, 52; color = rgb(e8e8ec); rounding = 0; halign = center; valign = center; position = 1228, -638; }

# the one brand touch — a short red tick off the top-left bracket's arm
shape { monitor = ; size = 14, 2; color = rgb(c81e2c); rounding = 0; halign = center; valign = center; position = -1162, 664; }

# ---- readouts --------------------------------------------------------------
label {
    monitor = ; text = KUBER · CORP-01; color = rgb(7d7d87); font_size = 11
    font_family = JetBrains Mono; position = -1172, 616; halign = center; valign = center
}

label {
    monitor = ; text = cmd[update:1000] date +"%H:%M"; color = rgb(e8e8ec); font_size = 46
    font_family = JetBrains Mono; position = 0, 64; halign = center; valign = center
}

label {
    monitor = ; text = cmd[update:60000] date +"%Y-%m-%d"; color = rgb(7d7d87); font_size = 12
    font_family = JetBrains Mono; position = 0, 22; halign = center; valign = center
}

input-field {
    monitor           =
    size              = 260, 44
    outline_thickness = 1
    rounding          = 0
    dots_size         = 0.24
    dots_spacing      = 0.32
    dots_center       = true
    outer_color       = rgb(232329)
    inner_color       = rgb(121216)
    font_color        = rgb(e8e8ec)
    check_color       = rgb(c81e2c)
    fail_color        = rgb(c81e2c)
    fade_on_empty     = false
    placeholder_text  = <span foreground="##7d7d87">locked</span>
    fail_text         = <span foreground="##c81e2c">$FAIL ($ATTEMPTS)</span>
    position          = 0, -24
    halign            = center
    valign            = center
}

label {
    monitor = ; text = K U B E R; color = rgb(35353d); font_size = 10
    font_family = JetBrains Mono; position = 0, 28; halign = center; valign = bottom
}
