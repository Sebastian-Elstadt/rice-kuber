# Kuber — foot (>= 1.28 schema). Black + cold white; one accent = corp red.

[main]
font=JetBrains Mono:size=11
line-height=15
pad=10x10 center
dpi-aware=no
bold-text-in-bright=no
initial-color-theme=dark

[cursor]
style=block
blink=no

[scrollback]
lines=10000

[colors-dark]
alpha=1.0
background=0a0a0d
foreground=e8e8ec
cursor=0a0a0d e8e8ec

selection-foreground=0a0a0d
selection-background=e8e8ec
urls=c81e2c

# 16-colour palette: collapsed toward black/white. Red fills the red/yellow
# slots; cyan ("data") fills the cyan/blue slots — everything else is a
# shade of cold grey.
regular0=121216
regular1=c81e2c
regular2=7d7d87
regular3=c81e2c
regular4=3dd6ff
regular5=7d7d87
regular6=3dd6ff
regular7=e8e8ec
bright0=35353d
bright1=e23c48
bright2=a0a0ab
bright3=e23c48
bright4=6ee3ff
bright5=a0a0ab
bright6=6ee3ff
bright7=f5f5f7
